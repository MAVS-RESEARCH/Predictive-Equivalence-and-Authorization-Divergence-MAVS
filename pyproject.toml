[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pead-bench"
version = "0.1.0"
description = "Predictive Equivalence and Authorization Divergence benchmark controls"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "MAVS Research"}]
dependencies = [
  "numpy==2.3.4",
  "pgmpy==1.0.0",
  "psutil==7.0.0",
  "PyYAML==6.0.2",
  "python-docx==1.2.0",
  "scikit-learn==1.7.1",
  "torch==2.9.1",
  "transformers==4.55.4",
]

[project.scripts]
pead-validate-config = "pead.config.validator:main"
pead-audit-phase0 = "pead.phase0.audit:main"
pead-audit-phase1 = "pead.phase1.audit:main"
pead-run-phase1-tests = "pead.phase1.test_runner:main"
pead-audit-labels = "pead.phase2.audit:main"
pead-run-phase2-tests = "pead.phase2.test_runner:main"
pead-audit-phase3 = "pead.phase3.audit:main"
pead-run-phase3-tests = "pead.phase3.test_runner:main"
pead-audit-phase4 = "pead.phase4.audit:main"
pead-run-phase4-tests = "pead.phase4.test_runner:main"
pead-audit-phase5 = "pead.phase5.audit:main"
pead-run-phase5-tests = "pead.phase5.test_runner:main"
pead-audit-access = "pead.phase6.audit:main"
pead-audit-representation-parity = "pead.phase6.parity:main"
pead-run-phase6-tests = "pead.phase6.test_runner:main"
pead-audit-phase7 = "pead.phase7.audit:main"
pead-run-phase7-tests = "pead.phase7.test_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
