- requirement_id: DOCX-T024-R000
  source_locator: table:24;row:0;heading:7.3 Twin-generation algorithm
  exact_source_clause: 'def generate_exact_pair(seed, domain, mechanism): world_a = primary_generator.sample(seed, domain,
    mechanism) intervention = mechanism.sample_intervention(world_a) world_b = intervention.apply(world_a, freeze_predictive_parents=True)
    p_a = predictive_projector(world_a) p_b = predictive_projector(world_b) assert canonical_bytes(p_a) == canonical_bytes(p_b)
    labels_a = dual_label(world_a) labels_b = dual_label(world_b) assert labels_a.agree and labels_b.agree assert labels_a.value
    != labels_b.value assert not leakage_audit.detect(p_a, p_b, intervention) return PairRecord.from_worlds(world_a, world_b,
    intervention)'
