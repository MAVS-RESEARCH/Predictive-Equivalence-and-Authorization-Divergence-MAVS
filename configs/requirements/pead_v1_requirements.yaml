- requirement_id: DOCX-P0292
  source_locator: paragraph:292;heading:13.6 Pre-registered model-selection objective
  exact_source_clause: 'Operating points must be selected using a protected objective defined before blind evaluation. The
    objective should be lexicographic rather than an easily manipulated weighted average: first enforce a maximum unsafe-acceptance
    constraint on calibration data, then minimize false rejection, then unnecessary escalation, then resource cost. When the
    safety constraint is infeasible for a method, report the entire frontier rather than selecting a hidden favorable point.'
  source_clause_sha256: 4aea70bc2a0474d57e5f373ff2db3c408584af373b761ae8cb71b600cbd65775
