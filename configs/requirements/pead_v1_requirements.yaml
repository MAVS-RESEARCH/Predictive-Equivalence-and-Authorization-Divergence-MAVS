- requirement_id: DOCX-P0289
  source_locator: paragraph:289;heading:13.5 Blind-run adjudication protocol
  exact_source_clause: 'A blind run must distinguish infrastructure defects from scientific underperformance before any result-driven
    action is taken. Infrastructure defects are failures of the pre-registered execution contract: corrupted files, broken
    serialization, label-engine disagreement, forbidden access, missing traces, or reproducibility mismatch. Scientific underperformance
    means a valid method performs poorly while the benchmark remains intact. Only the first category permits repair and rerun.'
  source_clause_sha256: 456f3e4a6815f8d029d3fc67c355c708a6ab0568e0a85b294a191b11a20bdebf
