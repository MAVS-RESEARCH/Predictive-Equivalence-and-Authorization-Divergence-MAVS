schema_version: "1.0"
schema_id: "PEAD-DIAGNOSTIC-v1"
required_fields:
  - "schema_version"
  - "diagnostic_id"
  - "semantic_name"
  - "version"
  - "status"
  - "failure_family"
  - "applicable_context"
  - "target_condition"
  - "prescribed_response"
  - "permitted_influence_paths"
  - "prohibited_influence_paths"
  - "maximum_authority"
  - "generators"
  - "monotonicity_contract"
  - "interaction_partners"
  - "metrics"
  - "retirement_rule"
generator_keys:
  - "positive"
  - "matched_negative"
  - "boundary"
  - "adversarial_out_of_scope"
mandatory_metrics:
  - "sensitivity"
  - "specificity"
  - "conditional_predictive_effect"
  - "in_scope_influence"
  - "out_of_scope_influence"
  - "redundancy"
  - "instability"
  - "composition"
  - "leakage"
  - "discontinuity"
authority_levels:
  - "observation-only"
  - "soft-evidence"
  - "bounded-mitigation"
  - "threshold-pressure"
  - "conjunctive-veto-input"
  - "hard-veto"
global_constraints:
  - "Every diagnostic is evaluated within a declared scope."
  - "Every diagnostic has positive, matched-negative, boundary, and adversarial out-of-scope generators."
  - "Raw correlation presence has no independent veto authority."
  - "Out-of-scope patterns cannot activate a prohibited influence path."
  - "Diagnostic interactions are evaluated pairwise and as registered compositions."
  - "Retirement or semantic change creates a new diagnostic version."
