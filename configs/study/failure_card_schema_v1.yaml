schema_version: "1.0"
record_type: "FailureCard"
additional_fields_allowed: false
required_fields:
  - "failure_card_id"
  - "case_or_group_id"
  - "run_id"
  - "commit_hash"
  - "environment_hash"
  - "config_hash"
  - "method_id"
  - "projection_hash"
  - "trace_hash"
  - "domain_id"
  - "mechanism_id"
  - "partition_id"
  - "atomic_group_id"
  - "expected_action"
  - "observed_action"
  - "visible_evidence_hash"
  - "protected_error_type"
  - "diagnostic_state"
  - "access_profile"
  - "scope_contract_id"
  - "root_cause_class"
  - "root_cause_evidence"
  - "case_validity_verdict"
  - "containment_status"
  - "quarantine_status"
  - "repair_status"
  - "invalidation_status"
  - "affected_claim_ids"
  - "affected_outcome_tiers"
  - "reproduction_command"
  - "artifact_references"
bijection_events:
  - "protected error"
  - "scope anomaly"
  - "label disagreement"
  - "access violation"
  - "quarantine"
  - "invalidation"
  - "reproduction mismatch"
release_gate: "Exactly one canonical FailureCard per qualifying event; no missing, duplicate, orphaned, or schema-invalid cards."
