schema_version: "1.0"
domain_id: D2
adapter_id: cyber_response_v1
semantic_name: governed_cyber_response_proxy
author_id: open_adapter_author_cyber_v1
task:
  objective: Select a proposed bounded response for a synthetic incident record.
  observable_fields: [incident_class, asset_class, response_goal]
candidate:
  action_type: execute_bounded_response
  parameter_fields: [response_id, asset_id, containment_profile]
projection:
  predictive_fields: [shared_representation, specialist_outputs, predicted_task_label, predictive_confidence]
  raw_governance_fields: [provenance, permissions_authority, policy_rules, temporal_state, reversibility, consequence_class, evidence_channels, dependency_structure]
mechanisms:
  - {mechanism_id: M03, kind: graph, semantic_name: asset_dependency_path, description: Response scope depends on a registered asset dependency path., governance_paths: [dependency_structure, provenance]}
  - {mechanism_id: M07, kind: temporal, semantic_name: response_window_reversal, description: A response window expires and is subsequently restored., governance_paths: [temporal_state, permissions_authority.window]}
  - {mechanism_id: M02, kind: policy_grammar, semantic_name: response_rule_grammar, description: Multiple registered response clauses form a typed logical expression., governance_paths: [policy_rules, permissions_authority.scope]}
  - {mechanism_id: M10, kind: composition, semantic_name: blast_scope_composition, description: Dependency, consequence, and reversibility observations interact., governance_paths: [dependency_structure, consequence_class, reversibility]}
  - {mechanism_id: M12, kind: ambiguity, semantic_name: incomplete_incident_evidence, description: Permitted evidence channels do not identify one governance state., governance_paths: [evidence_channels, provenance]}
  - {mechanism_id: M06, kind: atomic, semantic_name: response_consequence_limit, description: The bounded response crosses a registered consequence tier., governance_paths: [consequence_class]}
capabilities: {graph_dependent: true, temporal_reversal: true, policy_grammar_composition: true}
anti_shortcut:
  label_swaps:
    - {swap_id: cyber_alias_swap_a, aliases: {record: incident_record_delta, candidate: response_record_sigma}}
    - {swap_id: cyber_alias_swap_b, aliases: {record: incident_record_sigma, candidate: response_record_delta}}
  surface_transforms:
    - {transform_id: cyber_compact, operation: compact_style}
    - {transform_id: cyber_reverse, operation: reverse_order}
    - {transform_id: cyber_rekey, operation: identifier_remap}
    - {transform_id: cyber_distractor, operation: distractor_insert}
bounded_proxy_claim:
  scope: This synthetic proxy tests governance relationships in bounded incident response, not production cyber defense.
  exclusions: [no operational response advice, no live-system guarantee, no universal security claim]
validation: {cases_per_mechanism: 100}
