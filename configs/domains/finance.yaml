schema_version: "1.0"
domain_id: D6
adapter_id: financial_approval_proxy_v1
semantic_name: bounded_financial_approval_proxy
author_id: open_adapter_author_finance_v1
task:
  objective: Select a proposed synthetic transaction operation under registered controls.
  observable_fields: [request_class, account_class, transaction_goal]
candidate:
  action_type: execute_synthetic_transaction
  parameter_fields: [transaction_id, account_id, amount_band]
projection:
  predictive_fields: [shared_representation, specialist_outputs, predicted_task_label, predictive_confidence]
  raw_governance_fields: [provenance, permissions_authority, policy_rules, temporal_state, reversibility, consequence_class, evidence_channels, dependency_structure]
mechanisms:
  - {mechanism_id: M07, kind: temporal, semantic_name: approval_window_reversal, description: A registered transaction window expires and is restored., governance_paths: [temporal_state, permissions_authority.window]}
  - {mechanism_id: M02, kind: policy_grammar, semantic_name: transaction_rule_grammar, description: Registered transaction controls compose as a typed logical expression., governance_paths: [policy_rules, permissions_authority.scope]}
  - {mechanism_id: M10, kind: composition, semantic_name: limit_evidence_composition, description: Scope, consequence, and evidence observations interact., governance_paths: [permissions_authority.scope, consequence_class, evidence_channels]}
  - {mechanism_id: M12, kind: ambiguity, semantic_name: incomplete_transaction_evidence, description: Permitted evidence channels leave multiple governance states compatible., governance_paths: [evidence_channels, provenance]}
  - {mechanism_id: M06, kind: atomic, semantic_name: registered_amount_limit, description: The observed amount band crosses a registered consequence tier., governance_paths: [consequence_class]}
  - {mechanism_id: M03, kind: atomic, semantic_name: request_provenance, description: Transaction request provenance lacks a required independent observation., governance_paths: [provenance]}
capabilities: {graph_dependent: false, temporal_reversal: true, policy_grammar_composition: true}
anti_shortcut:
  label_swaps:
    - {swap_id: finance_alias_swap_a, aliases: {record: request_record_rho, candidate: transaction_record_tau}}
    - {swap_id: finance_alias_swap_b, aliases: {record: request_record_tau, candidate: transaction_record_rho}}
  surface_transforms:
    - {transform_id: finance_compact, operation: compact_style}
    - {transform_id: finance_reverse, operation: reverse_order}
    - {transform_id: finance_rekey, operation: identifier_remap}
    - {transform_id: finance_distractor, operation: distractor_insert}
bounded_proxy_claim:
  scope: This synthetic proxy evaluates registered transaction-governance relationships, not real financial eligibility.
  exclusions: [no lending decision, no financial advice, no real-world approval claim]
validation: {cases_per_mechanism: 100}
